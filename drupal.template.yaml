apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: Secret
metadata:
  name: drupalcms-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  mariadb-root-password: "${MARIADB_ROOT_PASSWORD}"
  mariadb-database: "drupalcms"
  mariadb-user: "drupal"
  mariadb-password: "${MARIADB_PASSWORD}"
  drupal-hash-salt: "${DRUPAL_HASH_SALT}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drupalcms-nginx
  namespace: ${NAMESPACE}
data:
  default.conf: |
    server {
      listen 80;
      server_name ${DOMAIN} www.${DOMAIN} _;
      root /var/www/html/app/web;
      index index.php index.html;

      client_max_body_size 64m;

      location = /favicon.ico {
        log_not_found off;
        access_log off;
      }

      location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
      }

      location / {
        try_files $uri /index.php?$query_string;
      }

      location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
      }

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf)$ {
        try_files $uri /index.php?$query_string;
        expires max;
        log_not_found off;
      }

      location ~ /\.(?!well-known).* {
        deny all;
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: drupalcms-code
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: ${NAMESPACE}
spec:
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: ${NAMESPACE}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mariadb
          image: mariadb:10.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-password
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "1Gi"
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: drupalcms
  namespace: ${NAMESPACE}
spec:
  selector:
    app: drupalcms
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupalcms
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: drupalcms
  template:
    metadata:
      labels:
        app: drupalcms
    spec:
      initContainers:
        - name: init-drupal-cms
          image: drupal:11.3.8-php8.4-fpm-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drupalcms-secrets
                  key: mariadb-password
          command:
            - /bin/sh
            - -ec
            - |
              apt-get update
              apt-get install -y --no-install-recommends git unzip curl ca-certificates
              rm -rf /var/lib/apt/lists/*

              curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
              php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm -f /tmp/composer-setup.php

              mkdir -p /var/www/html/app

              if [ ! -f /var/www/html/app/composer.json ]; then
                composer create-project "drupal/cms:^2" /var/www/html/app --no-interaction
                cd /var/www/html/app
                composer install --no-interaction
                composer drupal:recipe-unpack --no-interaction || true
              fi

              mkdir -p /var/www/html/app/web/sites/default/files
              mkdir -p /var/www/html/app/config/sync

              cat > /var/www/html/app/web/sites/default/settings.php <<PHP
              <?php
              \$databases['default']['default'] = [
                'database' => '${DB_NAME}',
                'username' => '${DB_USER}',
                'password' => '${DB_PASSWORD}',
                'prefix' => '',
                'host' => 'mariadb',
                'port' => '3306',
                'driver' => 'mysql',
                'collation' => 'utf8mb4_general_ci',
              ];

              \$settings['hash_salt'] = '${DRUPAL_HASH_SALT}';
              \$settings['config_sync_directory'] = '../config/sync';

              \$settings['trusted_host_patterns'] = [
                '^${DOMAIN_REGEX}$',
                '^www\\.${DOMAIN_REGEX}$',
                '^drupalcms$',
                '^drupalcms\\.${NAMESPACE}\\.svc(\\.cluster\\.local)?$',
                '^localhost$',
                '^127\\.0\\.0\\.1$',
              ];

              \$settings['reverse_proxy'] = TRUE;
              \$settings['reverse_proxy_addresses'] = [\$_SERVER['REMOTE_ADDR']];
              \$settings['file_public_path'] = 'sites/default/files';
              PHP

              chown -R www-data:www-data /var/www/html/app
              chmod -R ug+rwX /var/www/html/app/web/sites/default/files
              chmod 644 /var/www/html/app/web/sites/default/settings.php
          volumeMounts:
            - name: drupalcms-code
              mountPath: /var/www/html
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "3Gi"

      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: drupalcms-code
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

        - name: php
          image: drupal:11.3.8-php8.4-fpm-bookworm
          imagePullPolicy: IfNotPresent
          workingDir: /var/www/html/app
          volumeMounts:
            - name: drupalcms-code
              mountPath: /var/www/html
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "1Gi"

        - name: tools
          image: drupal:11.3.8-php8.4-fpm-bookworm
          imagePullPolicy: IfNotPresent
          workingDir: /var/www/html/app
          command:
            - /bin/sh
            - -ec
            - |
              apt-get update
              apt-get install -y --no-install-recommends git unzip curl mariadb-client ca-certificates
              rm -rf /var/lib/apt/lists/*
              curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
              php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm -f /tmp/composer-setup.php
              sleep infinity
          volumeMounts:
            - name: drupalcms-code
              mountPath: /var/www/html
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "4"
              memory: "512Mi"

      volumes:
        - name: drupalcms-code
          persistentVolumeClaim:
            claimName: drupalcms-code
        - name: nginx-config
          configMap:
            name: drupalcms-nginx
            defaultMode: 0644
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drupalcms
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${DOMAIN}
        - www.${DOMAIN}
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drupalcms
                port:
                  number: 80
    - host: www.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drupalcms
                port:
                  number: 80
